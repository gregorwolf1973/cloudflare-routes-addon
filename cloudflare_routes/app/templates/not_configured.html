{% extends "base.html" %}
{% block content %}
<div class="page-header"><span class="page-title">Konfiguration erforderlich</span></div>
<div class="card">
  <div class="card-body" style="text-align:center; padding: 48px 24px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1.5" style="width:56px;height:56px;margin-bottom:16px;">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>
      <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <div class="page-title" style="margin-bottom:8px;">Addon noch nicht konfiguriert</div>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:24px;">
      Bitte API-Token und Zone-ID in den Addon-Einstellungen eintragen.
    </p>
    <div class="card" style="max-width:440px;margin:0 auto;text-align:left;">
      <div class="card-header"><div class="card-header-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Benötigte Felder
      </div></div>
      <div class="list-item">
        <span><code>cloudflare_api_token</code></span>
        <span class="badge badge-err">Pflicht</span>
      </div>
      <div class="list-item">
        <span><code>zone_id</code></span>
        <span class="badge badge-err">Pflicht</span>
      </div>
      <div class="list-item">
        <span><code>account_id</code></span>
        <span class="badge badge-dim">Für Tunnel</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
